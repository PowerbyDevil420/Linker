      // Resilient local storage persistence for users & custom browsers
      const LOCAL_USERS_KEY = "linker_users_data";
      const LOCAL_BROWSERS_KEY = "linker_custom_browsers";

      function getLocalUsers() {
        try {
          const raw = localStorage.getItem(LOCAL_USERS_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function saveLocalUsers(users) {
        try {
          localStorage.setItem(LOCAL_USERS_KEY, JSON.stringify(users || []));
        } catch (e) {
          console.warn("Notice: Local user storage save issue", e);
        }
      }

      function getLocalCustomBrowsers() {
        try {
          const raw = localStorage.getItem(LOCAL_BROWSERS_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch {
          return [];
        }
      }

      function saveLocalCustomBrowsers(browsers) {
        try {
          const custom = (browsers || []).filter(
            (b) => !DEFAULT_BROWSERS.some((db) => db.id === b.id),
          );
          localStorage.setItem(LOCAL_BROWSERS_KEY, JSON.stringify(custom));
        } catch (e) {
          console.warn("Notice: Local browser storage save issue", e);
        }
      }

      function formatTimeAgo(isoStringOrTimestamp) {
        if (!isoStringOrTimestamp) return null;
        const time =
          typeof isoStringOrTimestamp === "number"
            ? isoStringOrTimestamp
            : new Date(isoStringOrTimestamp).getTime();
        if (isNaN(time)) return null;

        const diffSec = Math.max(0, Math.floor((Date.now() - time) / 1000));
        if (diffSec < 45) return "just now";
        const diffMin = Math.floor(diffSec / 60);
        if (diffMin < 60) return `${diffMin} min${diffMin > 1 ? "s" : ""} ago`;
        const diffHr = Math.floor(diffMin / 60);
        if (diffHr < 24) return `${diffHr} hour${diffHr > 1 ? "s" : ""} ago`;
        const diffDay = Math.floor(diffHr / 24);
        if (diffDay < 30) return `${diffDay} day${diffDay > 1 ? "s" : ""} ago`;
        const diffMonth = Math.floor(diffDay / 30);
        return `${diffMonth} month${diffMonth > 1 ? "s" : ""} ago`;
      }

      function getDetectedOS() {
        const ua = window.navigator.userAgent || "";
        const platform =
          window.navigator?.userAgentData?.platform ||
          window.navigator.platform ||
          "";

        // Detect iOS (iPhone, iPad, iPod, and iPadOS desktop mode)
        const isIOS =
          /iPad|iPhone|iPod/i.test(ua) ||
          (platform === "MacIntel" && window.navigator.maxTouchPoints > 1) ||
          /iPad|iPhone|iPod/i.test(platform);

        if (isIOS) return "ios";

        const isAndroid = /Android/i.test(ua) || /Android/i.test(platform);
        if (isAndroid) return "android";

        return "desktop";
      }

      function getActiveOS() {
        if (state.osOverride && state.osOverride !== "auto") {
          return state.osOverride;
        }
        const detected = getDetectedOS();
        return detected === "ios" ? "ios" : "android";
      }

      function getLinkLastUsedTime(linkId) {
        if (!linkId) return null;
        const activeKey = state.role === "admin" ? "admin" : state.userKey;
        if (state.history && state.history.length > 0) {
          const entry = state.history.find(
            (h) =>
              h.linkId === linkId && (!activeKey || h.userKey === activeKey),
          );
          if (entry && entry.timestamp) return entry.timestamp;
          // Fallback to any user's last history entry for this link if current user has none
          const fallbackEntry = state.history.find((h) => h.linkId === linkId);
          if (fallbackEntry && fallbackEntry.timestamp)
            return fallbackEntry.timestamp;
        }
        return null;
      }

      function showToast(message, icon = "fa-check-circle") {
        let toast = document.getElementById("app-toast");
        if (!toast) {
          toast = document.createElement("div");
          toast.id = "app-toast";
          toast.className =
            "fixed bottom-24 left-1/2 -translate-x-1/2 z-[200] bg-stone-900/95 text-white px-4 py-2.5 rounded-2xl shadow-2xl text-xs font-bold flex items-center gap-2.5 backdrop-blur pointer-events-none transition-all duration-300 opacity-0 translate-y-4 border border-stone-800 max-w-[90vw]";
          document.body.appendChild(toast);
        }
        const iconColor =
          icon.includes("emerald") || icon.includes("check")
            ? "text-emerald-400"
            : icon.includes("rose") || icon.includes("times") || icon.includes("lock")
            ? "text-rose-400"
            : "text-amber-400";
        toast.innerHTML = `<i class="fas ${icon} ${iconColor} text-sm shrink-0"></i> <span class="truncate">${escapeHTML(message)}</span>`;
        toast.classList.remove("opacity-0", "translate-y-4");
        toast.classList.add("opacity-100", "translate-y-0");

        if (window._toastTimeout) clearTimeout(window._toastTimeout);
        window._toastTimeout = setTimeout(() => {
          toast.classList.remove("opacity-100", "translate-y-0");
          toast.classList.add("opacity-0", "translate-y-4");
        }, 2500);
      }

      const generateId = () =>
        Date.now().toString() + Math.random().toString(36).substr(2, 9);

      function recordLinkUsage(link) {
        if (!link) return;
        link.usageCount = (link.usageCount || 0) + 1;
        supabaseClient
          .from("links")
          .update({ usage_count: link.usageCount })
          .eq("id", link.id)
          .then();

        const activeUserKey = state.userKey || "admin";
        const newHist = {
          id: generateId(),
          userKey: activeUserKey,
          linkId: link.id,
          title: link.title,
          url: link.url,
          timestamp: new Date().toISOString(),
        };
        state.history.unshift(newHist);
        supabaseClient
          .from("history")
          .insert({
            id: newHist.id,
            user_key: newHist.userKey,
            link_id: newHist.linkId,
            title: newHist.title,
            url: newHist.url,
            timestamp: newHist.timestamp,
          })
          .then(({ error }) => {

          });
        if (state.history.length > 500) {
          state.history = state.history.slice(0, 500);

        if (state.role === "user" && state.userKey) {
          const user = state.users.find((u) => u.key === state.userKey);
          if (user) {

      // --- Intent Logic ---
      function generateBrowserIntent(url, browserId) {
        let normalizedUrl = url.trim();
        if (!/^https?:\/\//i.test(normalizedUrl)) {
          normalizedUrl = "https://" + normalizedUrl;
        }
        if (browserId === "default") return normalizedUrl;

        const browserConf = state.browsers.find((b) => b.id === browserId);
        if (!browserConf || !browserConf.package) return normalizedUrl;

        try {
          const urlObj = new URL(normalizedUrl);
          const scheme = urlObj.protocol.replace(":", "");
          const hostAndPath = `${urlObj.host}${urlObj.pathname}${urlObj.search}${urlObj.hash}`;
          return `intent://${hostAndPath}#Intent;scheme=${scheme};package=${browserConf.package};end;`;
        } catch (e) {
          return url;
        }
      }

                "hover:bg-amber-600",
                "border-amber-600",
              );
              target.classList.add(
                "bg-emerald-600",
                "hover:bg-emerald-700",
                "border-emerald-700",
              );

              setTimeout(() => {
                if (document.body.contains(target)) {

                    "bg-emerald-600",
                    "hover:bg-emerald-700",
                    "border-emerald-700",
                  );

              if (isIOS) {
                showToast(
                  "Link copied! Status is pending — please confirm with ✅ or ❌ below.",
                  "fa-hourglass-half",

              } else {
                showToast(
                  "Link copied to clipboard! Ready to paste into Safari or any browser.",
                );

            };

            const fallbackCopy = (text) => {
              try {
                const ta = document.createElement("textarea");
                ta.value = text;
                ta.style.position = "fixed";
                ta.style.opacity = "0";
                document.body.appendChild(ta);
                ta.focus();
                ta.select();
                document.execCommand("copy");
                document.body.removeChild(ta);
              } catch (e) {
                console.warn("Copy fallback notice:", e);
              }
            };

            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard
                .writeText(urlToCopy)
                .then(executeCopyFeedback)
                .catch(() => {
                  fallbackCopy(urlToCopy);
                  executeCopyFeedback();
                });
            } else {
              fallbackCopy(urlToCopy);

              const user = state.users.find((u) => u.key === state.userKey);
              if (user) {
                if (!user.pinned) user.pinned = [];

                    .from("user_pinned_links")

                    .match({ user_key: state.userKey, link_id: link.id })

          state.addModalData = {
            device: state.filters.device || lastAttrs.device || "",
            country: state.filters.country || lastAttrs.country || "",
            software: state.filters.software || lastAttrs.software || "",
            update: state.filters.update || lastAttrs.update || "",
            url: "",
          };
          state.activeAddModalDropdown = null;
          render();
        } else if (action === "reset-add-modal-attrs") {
          state.addModalData = {
            device: "",
            country: "",
            software: "",
            update: "",
            url: state.addModalData.url || "",
          };
          state.activeAddModalDropdown = null;
          showToast("Attributes cleared", "fa-eraser");
          render();
        } else if (action === "fill-from-filters") {
          state.addModalData.device = state.filters.device || state.addModalData.device || "";
          state.addModalData.country = state.filters.country || state.addModalData.country || "";
          state.addModalData.software = state.filters.software || state.addModalData.software || "";
          state.addModalData.update = state.filters.update || state.addModalData.update || "";
          showToast("Filled from active filters", "fa-magic");
          render();
        } else if (action === "close-add-modal") {
          state.isAddModalOpen = false;
          render();
        } else if (action === "toggle-add-modal-dropdown") {
          const type = target.dataset.type;
          state.activeAddModalDropdown =
            state.activeAddModalDropdown === type ? null : type;
          render();
        } else if (action === "set-add-modal-attr") {
          const type = target.dataset.type;
          state.addModalData[type] = target.dataset.val;
          state.activeAddModalDropdown = null;
          render();
        } else if (action === "toggle-filter-dropdown") {
          const type = target.dataset.type;
          state.activeFilterDropdown =
            state.activeFilterDropdown === type ? null : type;
          render();
        } else if (action === "set-custom-filter") {
          const type = target.dataset.type;
          const val = target.dataset.val;
          state.filters[type] = state.filters[type] === val ? "" : val;
          state.activeFilterDropdown = null;
          render();
        } else if (action === "open-attr-editor") {
          state.adminEditAttr = target.dataset.type;
          render();
        } else if (action === "close-attr-editor") {
          state.adminEditAttr = null;
          render();
        } else if (action === "quick-add-attr") {
          const type = target.dataset.type;
          const input = document.getElementById("add-val-" + type);
          const val = input ? input.value.trim() : "";
          if (val) {
            let dup = false;
            let existingVal = val;
            for (let v of state.attributes[type]) {
              if (v.toLowerCase() === val.toLowerCase()) {
                dup = true;
                existingVal = v;
              }
            }
            if (!dup) {
              state.attributes[type].push(val);
              supabaseClient
                .from("attributes")
                .insert({ type: type, value: val })
                .then();
            }
            render();
          }
        } else if (action === "quick-add-modal-attr") {
          const type = target.dataset.type;
          const input = document.getElementById("add-modal-val-" + type);
          const val = input ? input.value.trim() : "";
          if (val) {
            let dup = false;
            let existingVal = val;
            for (let v of state.attributes[type]) {
              if (v.toLowerCase() === val.toLowerCase()) {
                dup = true;
                existingVal = v;
              }
            }
            if (!dup) {
              state.attributes[type].push(val);
              supabaseClient
                .from("attributes")
                .insert({ type: type, value: val })
                .then();
            }
            state.addModalData[type] = existingVal;
            state.activeAddModalDropdown = null;
            render();
          }
        } else if (action === "toggle-browser-popup") {
          state.activeBrowserDropdown = !state.activeBrowserDropdown;
          state.activeFilterDropdown = null;
          render();
        } else if (action === "select-browser") {
          state.selectedBrowser = target.dataset.val;
          localStorage.setItem("linker_browser", state.selectedBrowser);
          state.activeBrowserDropdown = false;
          render();
        }
      });

      window.filterDropdownOptions = function (input, listId) {
        const query = input.value.toLowerCase();
        const list = document.getElementById(listId);
        if (!list) return;
        const items = list.querySelectorAll("button[data-val]");
        items.forEach((item) => {
          const val = item.dataset.val || "";
          const textSpan = item.querySelector("span:last-child");
          const itemText = textSpan ? textSpan.textContent.toLowerCase() : "";
          if (val.toLowerCase().includes(query) || itemText.includes(query)) {
            item.style.setProperty("display", "flex", "important");
          } else {
            item.style.setProperty("display", "none", "important");
          }
        });
      };

      document.getElementById("app").addEventListener("submit", (e) => {
        const target = e.target.closest("[data-action]");
        if (!target) return;
        e.preventDefault();
        const action = target.dataset.action;

        if (action === "login") {
          const errorEl = document.getElementById("loginError");

          if (state.requireAdminPIN) {
            const pin = document.getElementById("adminPin").value.trim();
            if (pin === "SaGoRsaRdeR2003") {
              state.requireAdminPIN = false;
              setRole("admin");
            } else {
              errorEl.textContent = "Invalid PIN.";
              errorEl.classList.remove("hidden");
            }
            return;
          }

          const key = document.getElementById("activationKey").value.trim();

          if (key === "01922755197") {
            state.requireAdminPIN = true;
            render();
          } else {
            const user = state.users.find((u) => u.key === key);
            if (user) {
              if (user.isUsed) {
                errorEl.textContent = "This key has already been used.";
                errorEl.classList.remove("hidden");
              } else {
                user.isUsed = true;
                saveLocalUsers(state.users);
                if (state.usersSupabaseAvailable !== false) {
                  supabaseClient
                    .from("users")
                    .update({ is_used: true })
                    .eq("key", user.key)
                    .then((res) => {
                      if (res?.error && (res.error.message.includes("schema cache") || res.error.message.includes("does not exist"))) {
                        state.usersSupabaseAvailable = false;
                      }
                    })
                    .catch(() => {});
                }
                setRole("user", user.key);
              }
            } else {
              errorEl.textContent = "Invalid key. Please try again.";
              errorEl.classList.remove("hidden");
            }
          }
        } else if (action === "add-attr") {
          const type = target.dataset.type;
          const val = target.elements["val"].value.trim();
          let dup = false;
          for (let v of state.attributes[type]) {
            if (v.toLowerCase() === val.toLowerCase()) dup = true;
          }
          if (val && !dup) {
            state.attributes[type].push(val);
            supabaseClient
              .from("attributes")
              .insert({ type: type, value: val })
              .then();

            render();
          }
          target.reset();
        } else if (action === "create-user") {
          const name = target.elements["userName"]?.value.trim();
          if (!name) return;
          const chars =
            "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*()_+";
          let key = "";
          for (let i = 0; i < 25; i++)
            key += chars.charAt(Math.floor(Math.random() * chars.length));

          const newUser = {
            key,
            name,
            isUsed: false,
            isBanned: false,
            createdAt: new Date().toISOString(),
            pinned: [],
            usage: {},
          };
          state.users.unshift(newUser);
          saveLocalUsers(state.users);

          if (state.usersSupabaseAvailable !== false) {
            supabaseClient
              .from("users")
              .insert({
                key: newUser.key,
                name: newUser.name,
                is_used: newUser.isUsed,
                is_banned: newUser.isBanned,
                created_at: newUser.createdAt,
              })
              .then((res) => {
                if (res?.error && (res.error.message.includes("schema cache") || res.error.message.includes("does not exist"))) {
                  state.usersSupabaseAvailable = false;
                }
              })
              .catch(() => {});
          }

          render();
        } else if (action === "create-browser") {
          const bName = target.elements["browserName"].value.trim();
          const bPkg = target.elements["browserPackage"].value.trim();
          if (bName && bPkg) {
            const id = bName.toLowerCase().replace(/[^a-z0-9]/g, "-");
            const newBrowser = {
              id,
              name: bName,
              iconType: "fas",
              iconClass: "fa-globe",
              package: bPkg,
            };
            state.browsers.push(newBrowser);
            saveLocalCustomBrowsers(state.browsers);

            if (state.browsersSupabaseAvailable !== false) {
              supabaseClient
                .from("browsers")
                .insert({
                  id: newBrowser.id,
                  name: newBrowser.name,
                  icon_type: newBrowser.iconType,
                  icon_class: newBrowser.iconClass,
                  package: newBrowser.package,
                })
                .then((res) => {
                  if (res?.error && (res.error.message.includes("schema cache") || res.error.message.includes("does not exist"))) {
                    state.browsersSupabaseAvailable = false;
                  }
                })
                .catch(() => {});
            }

            if (state.selectedBrowser === "default") {
              state.selectedBrowser = id;
              localStorage.setItem("linker_browser", id);
            }

            render();
          }
        } else if (action === "add-link") {
          e.preventDefault();
          const url = target.elements["url"].value.trim();
          const device = target.elements["device"].value;
          const country = target.elements["country"].value;
          const software = target.elements["software"].value;
          const update = target.elements["update"].value;

          const errorDiv = document.getElementById("add-modal-error");
          if (!url || !device || !country || !software || !update) {
            if (errorDiv) {
              errorDiv.textContent = "Please fill in URL and select all attributes (Region, Device, Software, Update).";
              errorDiv.classList.remove("hidden");
            }
            return;
          }

          const newLink = {
            id: generateId(),
            title: url.replace(/^https?:\/\//, "").split("/")[0], // Extract domain as title
            url,
            device,
            country,
            software,
            update,
            usageCount: 0,
            isPinned: false,
            createdAt: new Date().toISOString(),
          };
          state.links.unshift(newLink);
          supabaseClient
            .from("links")
            .insert({
              id: newLink.id,
              title: newLink.title,
              url: newLink.url,
              device: newLink.device,
              country: newLink.country,
              software: newLink.software,
              update_attr: newLink.update,
              usage_count: 0,
              is_pinned: false,
              created_at: newLink.createdAt,
            })
            .then();

          saveLastUploadAttrs({ device, country, software, update });
          showToast("Link added successfully!", "fa-check");

          state.isAddModalOpen = false;
          state.addModalData = {
            device: device,
            country: country,
            software: software,
            update: update,
            url: "",
          };
          state.currentView = "home";
          render();
        }
      });

      document.getElementById("app").addEventListener("input", (e) => {
        if (e.target.id === "searchInput") {
          state.searchQuery = e.target.value.toLowerCase();
          const container = document.getElementById("links-container");
          if (container) container.innerHTML = renderLinksContent();
        }
      });

      document.getElementById("app").addEventListener("change", (e) => {
        if (e.target.id === "browserSelect") {
          state.selectedBrowser = e.target.value;
          localStorage.setItem("linker_browser", state.selectedBrowser);
          render();
        }
      });

      let lastScrollTop = 0;
      let isHeaderHidden = false;
      document.getElementById("app").addEventListener(
        "scroll",
        (e) => {
          if (e.target.id === "main-scroll") {
            const fh = document.getElementById("filter-header-wrapper");
            if (fh) {
              const st = e.target.scrollTop;
              if (Math.abs(st - lastScrollTop) > 5) {
                if (st > lastScrollTop && st > 30) {
                  if (!isHeaderHidden) {
                    fh.style.transform = "translateY(-100%)";
                    isHeaderHidden = true;
                  }
                } else if (st < lastScrollTop) {
                  if (isHeaderHidden) {
                    fh.style.transform = "translateY(0%)";
                    isHeaderHidden = false;
                  }
                }
                lastScrollTop = Math.max(0, st);
              }
            }
          }
        },
        true,
      );

      // --- Render System ---
      function escapeHTML(str) {
        if (!str) return "";
        return str
          .toString()
          .replace(
            /[&<>'"]/g,
            (tag) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                "'": "&#39;",
                '"': "&quot;",
              })[tag],
          );
      }

      let scrollState = new Map();
      function render() {
        const app = document.getElementById("app");
        if (state.isLoading) {
          app.innerHTML =
            '<div class="h-full flex items-center justify-center flex-col bg-pink-50"><i class="fas fa-spinner fa-spin text-pink-500 text-3xl mb-4"></i><span class="text-stone-800 font-bold">Connecting to Cloud...</span></div>';
          return;
        }

        if (state.role === "user" && state.userKey) {
          const userExists = state.users.some((u) => u.key === state.userKey);
          if (!userExists) {
            setRole(null);
            return;
          }
        }

        scrollState.clear();
        document
          .querySelectorAll(".overflow-y-auto, .overflow-auto")
          .forEach((el, index) => {
            const key = el.id || "scroll-" + index;
            scrollState.set(key, el.scrollTop);
          });

        let htmlContent = renderDashboard();
        if (!state.role) {
          htmlContent += `
                    <div class="fixed inset-0 z-[100] flex items-center justify-center bg-white/40 backdrop-blur-lg p-4 pointer-events-auto">
                        <div class="absolute inset-0 bg-pink-900/10 mix-blend-multiply"></div>
                        ${renderLoginBox()}
                    </div>
                `;
        }
        app.innerHTML = htmlContent;

        document
          .querySelectorAll(".overflow-y-auto, .overflow-auto")
          .forEach((el, index) => {
            const key = el.id || "scroll-" + index;
            if (scrollState.has(key)) el.scrollTop = scrollState.get(key);
          });
        document.querySelectorAll('[id^="dropdown-list-"]').forEach((el) => {
          const type = el.id.replace("dropdown-list-", "");
          if (state.dropdownScrolls[type] !== undefined) {
            el.scrollTop = state.dropdownScrolls[type];
          }
        });
      }

      // --- Views ---
      function renderLoginBox() {
        return `
                <div class="w-full max-w-md p-8 rounded-3xl bg-white/90 border border-pink-100 shadow-2xl relative z-[110]">
                        <h1 class="text-xl sm:text-2xl font-black tracking-tight text-center text-pink-950 mb-8 leading-snug">
                            ${state.requireAdminPIN ? "Enter Admin PIN" : "Enter the secret key received from the admin"}
                        </h1>
                        
                        <form data-action="login" class="space-y-4">
                            <div>
                                ${
                                  state.requireAdminPIN
                                    ? `
                                    <input type="password" id="adminPin" placeholder="Enter PIN..." class="w-full px-5 py-3.5 bg-pink-50/50 border border-pink-200 rounded-xl text-stone-800 placeholder-stone-400 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all font-bold text-center tracking-widest" required>
                                `
                                    : `
                                    <input type="text" id="activationKey" placeholder="Activation Key..." class="w-full px-5 py-3.5 bg-pink-50/50 border border-pink-200 rounded-xl text-stone-800 placeholder-stone-400 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all font-bold text-center tracking-widest" required>
                                `

                            <button type="submit" class="w-full py-4 px-4 bg-pink-500 hover:bg-pink-400 text-white rounded-xl font-bold transition-all shadow-lg shadow-pink-500/30 text-base">
                                Authenticate
                            </button>
                        </form>

                        ${
                          !state.requireAdminPIN
                            ? `
                        <div class="mt-6 text-center">
                            <a href="https://wa.me/8801946620424?text=Please%20give%20me%20a%20secret%20key" target="_blank" class="inline-flex items-center justify-center gap-2 text-emerald-600 hover:text-emerald-700 font-bold text-[13px] hover:underline transition-colors pb-1">
                                <i class="fab fa-whatsapp text-lg"></i> Contact the Admin
                            </a>
                        </div>
                        `
                            : ""
                        }
                    </div>
                </div>
            `;

      function renderBottomNav() {
        const navItems = [
          { id: "home", icon: "fa-home", label: "Home" },
          { id: "history", icon: "fa-history", label: "History" },
          { id: "pinned", icon: "fa-thumbtack", label: "Pinned" },

        if (state.role === "admin") {
          navItems.push({
            id: "members",
            icon: "fa-user-shield",
            label: "Members",

        }

        return navItems
          .map(
            (item) => `
                <button data-action="nav" data-view="${item.id}" class="flex flex-col items-center justify-center w-full h-full ${state.currentView === item.id ? "text-pink-600" : "text-stone-800 hover:text-stone-900"} transition-all ${state.currentView === item.id ? "bg-pink-50/50" : ""}">
                    <i class="fas ${item.icon} text-[18px] mb-1.5 leading-none ${state.currentView === item.id ? "scale-110 drop-shadow-sm" : ""} transition-transform"></i>
                    <span class="text-[10px] font-bold">${item.label}</span>
                </button>
            `,
          )
          .join("");
      }

      function renderLinkCard(link) {
        let isPinned = false;
        if (state.role === "admin") {
          isPinned = link.isPinned;
        } else if (state.role === "user" && state.userKey) {
          const user = state.users.find((u) => u.key === state.userKey);
          if (user && user.pinned) {
            isPinned = user.pinned.includes(link.id);
          }
        }

        const isIOS = getActiveOS() === "ios";
        const isPending = isIOS && state.pendingIosLinkId === link.id;
        const hasOtherPending = isIOS && !!state.pendingIosLinkId && state.pendingIosLinkId !== link.id;
        const lastUsedTs = getLinkLastUsedTime(link.id);
        const lastUsedAgo = formatTimeAgo(lastUsedTs);

        return `
                <div id="link-card-${link.id}" class="bg-white border ${isPending ? "border-amber-400 ring-2 ring-amber-300/80 bg-amber-50/20 shadow-md shadow-amber-500/10" : "border-pink-100"} p-2.5 sm:p-3 rounded-xl shadow-sm transition-all group flex flex-col gap-2 relative overflow-hidden">
                    <div class="absolute -top-6 -right-6 w-32 h-32 bg-gradient-to-bl from-pink-50/80 to-transparent rounded-full pointer-events-none"></div>
                    
                    <div class="absolute top-2 right-2 flex gap-1.5 z-20">
                        <button data-action="toggle-pin" data-id="${link.id}" class="w-6 h-6 flex items-center justify-center rounded-full bg-stone-50 hover:bg-pink-100 transition-colors text-[10px] ${isPinned ? "text-pink-600 bg-pink-50" : "text-stone-800"}">
                            <i class="fas fa-thumbtack"></i>
                        </button>
                        ${
                          state.role === "admin"
                            ? `
                        <button data-action="del-link" data-id="${link.id}" class="w-6 h-6 flex items-center justify-center rounded-full bg-stone-50 hover:bg-rose-100 text-stone-400 hover:text-rose-600 transition-colors text-[10px]">
                            <i class="fas fa-trash-alt"></i>
                        </button>
                        `
                            : ""
                        }
                    </div>

                    <div class="flex flex-row items-center justify-between gap-3 w-full">
                        <div class="flex-1 min-w-0 z-10 flex flex-col justify-center mt-2 sm:mt-1">
                            ${(() => {
                              let count = 0;
                              if (state.role === "user" && state.userKey) {
                                const user = state.users.find(
                                  (u) => u.key === state.userKey,
                                );
                                count = user?.usage?.[link.id] || 0;
                              } else if (state.role === "admin") {
                                count = state.history.filter(
                                  (h) =>
                                    h.userKey === "admin" && h.linkId === link.id,
                                ).length;
                              }

                              const countBadge = count > 0 ? `
                                    <div class="flex items-center gap-1.5 text-red-500 w-max">
                                        <div class="relative flex items-center justify-center w-6 h-6">
                                            <svg class="absolute inset-[2px] w-[calc(100%-4px)] h-[calc(100%-4px)] text-current origin-center" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                                <path stroke-dasharray="2 4" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10"></path>
                                            </svg>
                                            <svg class="absolute inset-0 w-full h-full text-current origin-center" viewBox="0 0 24 24">
                                                <circle cx="12" cy="12" r="10.5" stroke="currentColor" stroke-opacity="0.15" stroke-width="3" fill="none"></circle>
                                                <circle cx="12" cy="12" r="10.5" stroke="currentColor" stroke-width="3" fill="none" stroke-dasharray="65.973" stroke-dashoffset="${65.973 - 65.973 * (Math.min(count, 3) / 3)}" stroke-linecap="round" class="-rotate-90 origin-center" style="transition: stroke-dashoffset 0.3s ease;"></circle>
                                            </svg>
                                            <span class="text-[9px] font-black tracking-tighter">${count}</span>
                                        </div>
                                        <span class="text-sm font-bold tracking-tight">time${count > 1 ? "s" : ""}</span>
                                    </div>
                              ` : "";

                              const iosUsageTimeBadge = isIOS && lastUsedAgo ? `
                                    <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-800 border border-amber-200">
                                        <i class="far fa-clock text-[9px] text-amber-600"></i> used ${lastUsedAgo}
                                    </span>
                              ` : "";

                              if (!countBadge && !iosUsageTimeBadge) return "";

                              return `
                                    <div class="flex items-center flex-wrap gap-2 mb-1.5">
                                        ${countBadge}
                                        ${iosUsageTimeBadge}
                                    </div>
                              `;
                            })()}
                            <div class="flex flex-wrap items-center gap-1 mb-1">
                                <span class="bg-blue-50/80 text-blue-700 text-[8px] px-1 py-0.5 rounded font-bold uppercase tracking-wider border border-blue-100/50 flex items-center gap-1"><i class="fas fa-mobile-alt opacity-70"></i> ${escapeHTML(link.device)}</span>
                                <span class="bg-emerald-50/80 text-emerald-700 text-[8px] px-1 py-0.5 rounded font-bold uppercase tracking-wider border border-emerald-100/50 flex items-center gap-1">${getFlag(link.country)} ${escapeHTML(link.country)}</span>
                                <span class="bg-purple-50/80 text-purple-700 text-[8px] px-1 py-0.5 rounded font-bold uppercase tracking-wider border border-purple-100/50 flex items-center gap-1">${getSoftwareIcon(link.software)} ${escapeHTML(link.software)}</span>
                                <span class="bg-orange-50/80 text-orange-700 text-[8px] px-1 py-0.5 rounded font-bold uppercase tracking-wider border border-orange-100/50 flex items-center gap-1"><i class="fas fa-sync-alt opacity-70"></i> ${escapeHTML(link.update)}</span>
                            </div>
                        </div>

                        <div class="flex items-center z-10 shrink-0 relative mt-2 sm:mt-1">
                            ${
                              isIOS
                                ? (
                                  isPending
                                    ? `
                            <button data-action="copy-link" data-id="${link.id}" class="inline-flex items-center justify-center gap-1.5 bg-amber-500 hover:bg-amber-600 border-amber-600 text-white shadow-amber-500/20 px-3 sm:px-4 h-9 sm:h-10 rounded-xl font-bold text-[12px] transition-all shadow-md active:scale-95 border cursor-pointer" title="Already copied - awaiting confirmation below">
                                <i class="fas fa-hourglass-half text-[11px] animate-pulse"></i> Pending
                            </button>
                            `
                                    : (hasOtherPending
                                      ? `
                            <button data-action="copy-link" data-id="${link.id}" class="inline-flex items-center justify-center gap-1.5 bg-stone-100 text-stone-400 border-stone-200 px-3 sm:px-4 h-9 sm:h-10 rounded-xl font-bold text-[12px] border cursor-not-allowed opacity-60 hover:bg-rose-50 hover:text-rose-400 hover:border-rose-200 transition-colors" title="Another link is pending. Confirm or cancel it first.">

      function renderLinksContent() {
        let visibleLinks = state.links;
        if (state.filters.device)
          visibleLinks = visibleLinks.filter(
            (l) => l.device === state.filters.device,
          );
        if (state.filters.country)
          visibleLinks = visibleLinks.filter(
            (l) => l.country === state.filters.country,
          );
        if (state.filters.software)
          visibleLinks = visibleLinks.filter(
            (l) => l.software === state.filters.software,
          );
        if (state.filters.update)
          visibleLinks = visibleLinks.filter(
            (l) => l.update === state.filters.update,
          );

        if (state.searchQuery) {
          const q = state.searchQuery;
          visibleLinks = visibleLinks.filter(
            (l) =>
              l.title.toLowerCase().includes(q) ||
              l.url.toLowerCase().includes(q),
          );
        }

        const isIOS = getActiveOS() === "ios";
        const pendingLink =
          isIOS && state.pendingIosLinkId
            ? state.links.find((l) => l.id === state.pendingIosLinkId)
            : null;

        const pendingBanner = pendingLink
          ? `
                <div class="mx-4 sm:mx-6 mb-2 p-3 rounded-2xl bg-amber-50 border border-amber-300 flex items-center justify-between gap-3 shadow-sm animate-fadein">
                    <div class="flex items-center gap-2.5 text-xs font-bold text-amber-950 min-w-0">
                        <span class="w-7 h-7 rounded-full bg-amber-200 flex items-center justify-center text-amber-800 shrink-0">
                            <i class="fas fa-lock text-xs"></i>
                        </span>
                        <div class="truncate">
                            <span class="text-amber-900">1 link is pending confirmation (<span class="font-extrabold text-amber-950">${escapeHTML(pendingLink.device)} - ${escapeHTML(pendingLink.country)}</span>). Please confirm (✅) or cancel (❌) before copying another.</span>
                        </div>
                    </div>
                    <button data-action="scroll-to-pending" class="px-3 py-1.5 rounded-xl bg-amber-200 hover:bg-amber-300 text-amber-950 font-bold text-[11px] transition-colors shrink-0 flex items-center gap-1.5 cursor-pointer shadow-xs">
                        View Locked Link <i class="fas fa-arrow-down text-[9px]"></i>
                    </button>
                </div>
            `
          : "";

        const topBar = `
                <div class="flex justify-between items-center pt-4 px-4 sm:px-6 pb-2">
                    <div class="text-[11px] font-bold text-stone-800 uppercase tracking-widest bg-white/60 px-3 py-1.5 rounded-full border border-pink-100 shadow-sm flex items-center gap-1.5">
                        <i class="fas fa-link text-stone-400"></i> Total Links: <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full">${visibleLinks.length}</span>
                    </div>
                    ${
                      state.role === "admin"
                        ? `
                    <button data-action="open-add-modal" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2.5 rounded-lg text-xs font-bold transition-colors shadow-sm flex items-center gap-2 relative z-0">
                        <i class="fas fa-plus"></i> Add link
                    </button>
                    `
                        : ""
                    }
                </div>
                ${pendingBanner}
            `;

        if (visibleLinks.length === 0) {
          return `
                    ${topBar}
                    <div class="text-center py-16 bg-white/40 rounded-3xl border-2 border-dashed border-pink-200 mt-2 mx-4 sm:mx-6">
                        <i class="fas fa-filter text-4xl text-pink-200 mb-4 drop-shadow-sm"></i>
                        <p class="text-stone-800 text-[15px] font-bold">No records found matching filters.</p>
                    </div>
                `;
        }

        return `
                ${topBar}
                <div class="p-4 sm:p-6 space-y-4 pt-2">
                    ${visibleLinks.map((link) => renderLinkCard(link)).join("")}
                </div>
            `;
      }

                                            </button>
                                        `,

                                          .join("")}
                                    </div>
                                    ${

                                        </div>
                                    `
                                        : ""
                                    }
                                </div>
                            `
                                : ""
                            }
                        </div>
                    `;
                      })
                      .join("")}
                </div>
            `;

        return `
                <div class="flex-1 min-h-0 flex flex-col outline-none w-full relative overflow-hidden">
                    <div id="filter-header-wrapper" class="absolute top-0 left-0 w-full z-50 transition-transform duration-300 ease-out" style="transform: translateY(${isHeaderHidden ? "-100%" : "0%"});">

                    <div class="flex-1 overflow-y-auto w-full pb-32 pt-[124px] md:pt-[76px]" id="main-scroll" style="overflow-anchor: none;">
                        <div class="max-w-3xl mx-auto w-full relative h-full" id="links-container">
                            ${renderLinksContent()}
                        </div>
                    </div>
                </div>

      function renderPinnedView() {
        let pinnedLinks = [];
        if (state.role === "admin") {
          pinnedLinks = state.links.filter((l) => l.isPinned);
        } else if (state.role === "user" && state.userKey) {
          const user = state.users.find((u) => u.key === state.userKey);
          if (user && user.pinned) {
            pinnedLinks = state.links.filter((l) => user.pinned.includes(l.id));
          }
        }

        if (pinnedLinks.length === 0)
          return renderPlaceholder(
            "fa-thumbtack",
            "No Pinned Records",
            "Your favorite and most heavily accessed records will be pinned here for priority access.",
          );

        const isIOS = getActiveOS() === "ios";
        const pendingLink =
          isIOS && state.pendingIosLinkId
            ? state.links.find((l) => l.id === state.pendingIosLinkId)
            : null;

        const pendingBanner = pendingLink
          ? `

                    <div class="flex items-center gap-2.5 text-xs font-bold text-amber-950 min-w-0">

        return `

      function renderHistoryView() {
        const activeKey = state.role === "admin" ? "admin" : state.userKey;
        let viewHistory = state.history.filter((h) => h.userKey === activeKey);

        let totalRecordsCount = 0;
        if (state.role === "admin") {
          totalRecordsCount = viewHistory.length;
        } else if (state.role === "user" && state.userKey) {
          const user = state.users.find((u) => u.key === state.userKey);
          if (user && user.usage) {
            totalRecordsCount = Object.values(user.usage).reduce(
              (a, b) => a + b,
              0,
            );
          }
        }

        // Deduplicate for display: keep only the most recent entry for each link per user
        const seen = new Set();
        viewHistory = viewHistory.filter((h) => {
          const identifier = h.userKey + "_" + h.linkId;
          if (seen.has(identifier)) return false;
          seen.add(identifier);
          return true;
        });

        if (viewHistory.length === 0)
          return renderPlaceholder(
            "fa-history",
            "Activity History",
            "Your link clicking history, session audits, and recent activity will appear here.",
          );

        return `
                <div class="flex-1 min-h-0 overflow-y-auto w-full px-4 pt-4 pb-32 sm:px-6 sm:pt-6 sm:pb-32" id="history-scroll">
                    <div class="max-w-3xl mx-auto space-y-4">
                        <div class="flex items-center justify-between mb-4 px-2">
                            <h3 class="text-stone-800 font-bold text-sm bg-stone-100 px-3 py-1.5 rounded-lg inline-flex items-center gap-2 border border-stone-200">
                                <i class="fas fa-history text-stone-800"></i> Recent Activity
                            </h3>
                            <div class="text-[10px] font-bold text-stone-800 bg-stone-50 px-2 py-1 rounded-md border border-stone-200">
                                ${totalRecordsCount} records
                            </div>
                        </div>
                        ${viewHistory
                          .map((item) => {
                            const date = new Date(item.timestamp);
                            const timeStr = date.toLocaleTimeString([], {
                              hour: "2-digit",
                              minute: "2-digit",
                            });
                            const link = state.links.find(
                              (l) => l.id === item.linkId,
                            );
                            if (!link) return "";
                            return `
                                <div class="flex flex-col gap-1.5">
                                    <div class="pl-2 text-[10px] font-bold text-stone-800 uppercase tracking-widest flex items-center gap-1">
                                        <i class="far fa-clock"></i> Accessed at ${timeStr}
                                    </div>
                                    ${renderLinkCard(link)}
                                </div>
                            `;
                          })
                          .join("")}
                    </div>
                </div>
            `;
      }

      function renderActiveView() {
        if (state.currentView === "home") return renderHome();
        if (state.currentView === "history") return renderHistoryView();
        if (state.currentView === "pinned") return renderPinnedView();
        if (state.currentView === "members") return renderAdmin();
        return renderHome();
      }

      function renderDashboard() {
        return `
                <div class="flex-1 flex flex-col h-full overflow-hidden w-full relative">
                    
                    <!-- Top App Bar -->
                    <nav class="h-16 bg-white border-b border-pink-100 flex items-center justify-between px-4 sm:px-6 shrink-0 w-full shadow-[0_2px_10px_rgba(0,0,0,0.02)] relative z-[60]">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 bg-pink-500 rounded-xl flex items-center justify-center shadow-inner shadow-pink-300">
                                <i class="fas fa-bolt text-white text-sm animate-pulse"></i>
                            </div>
                            <div class="hidden sm:block leading-tight">
                                <span class="text-lg font-black tracking-tight text-pink-950 block">Link<span class="text-pink-500">Router</span></span>
                                <span class="text-[9px] font-bold text-stone-800 uppercase tracking-widest block">Core Environment</span>
                            </div>
                        </div>
                        
                        <div class="flex flex-1 justify-end items-center gap-2 sm:gap-4 ml-4">
                            <div class="hidden md:flex items-center gap-2 bg-pink-50/80 px-3 py-1.5 rounded-full border border-pink-100 ml-1">
                                <div class="w-2 h-2 ${state.role === "admin" ? "bg-indigo-400" : "bg-emerald-400"} rounded-full animate-pulse shadow-sm"></div>
                                <span class="text-[10px] font-black uppercase tracking-wider text-pink-900">${state.role === "admin" ? "Administrator" : "Verified User"}</span>
                            </div>

                            ${
                              getActiveOS() !== "ios"
                                ? `
                            <div class="relative w-[130px] sm:w-[150px]" id="browser-dropdown-wrapper">
                                <button data-action="toggle-browser-popup" class="w-full flex items-center justify-between bg-pink-50 hover:bg-pink-100 border border-pink-200 text-pink-900 py-2 sm:py-2.5 px-3 rounded-xl text-[10px] sm:text-xs font-bold shadow-sm focus:outline-none focus:ring-2 focus:ring-pink-300 cursor-pointer transition-colors max-w-full overflow-hidden">
                                     <div class="flex items-center gap-2 truncate">
                                        ${(() => {
                                          const activeB =
                                            state.browsers.find(
                                              (b) =>
                                                b.id === state.selectedBrowser,
                                            ) || state.browsers[0];
                                          return `<i class="${activeB.iconType} ${activeB.iconClass} text-pink-500"></i>
                                            <span class="truncate">${escapeHTML(activeB.name)}</span>`;
                                        })()}
                                     </div>
                                     <i class="fas fa-chevron-${state.activeBrowserDropdown ? "up" : "down"} text-[10px] opacity-70 shrink-0"></i>
                                </button>
                                
                                ${
                                  state.activeBrowserDropdown
                                    ? `
                                    <div class="absolute top-full right-0 mt-2 w-full min-w-[150px] bg-white border border-pink-100 rounded-xl shadow-xl z-[100] animate-popup overflow-hidden p-1.5 font-sans max-h-64 overflow-y-auto">
                                        ${state.browsers
                                          .map(
                                            (b) => `
                                            <button data-action="select-browser" data-val="${b.id}" class="w-full text-left px-3 py-2.5 text-[11px] sm:text-xs font-bold transition-colors flex items-center gap-2.5 rounded-lg ${state.selectedBrowser === b.id ? "bg-pink-50 text-pink-600" : "text-stone-700 hover:bg-stone-50"}">
                                                <i class="${b.iconType} ${b.iconClass} w-4 justify-center flex text-sm ${b.id === "chrome" ? "text-yellow-500" : b.id === "firefox" ? "text-orange-500" : b.id === "opera" ? "text-red-600" : b.id === "brave" ? "text-orange-400" : b.id === "duckduckgo" ? "text-emerald-600" : b.id === "tor" ? "text-purple-600" : "text-emerald-500"}"></i>
                                                <span class="truncate">${escapeHTML(b.name)}</span>
                                            </button>
                                        `,
                                          )
                                          .join("")}
                                    </div>
                                `
                                    : ""
                                }
                            </div>
                            `
                                : `
                            <div class="flex items-center gap-1.5 bg-pink-50/70 border border-pink-100 px-3 py-1.5 rounded-xl text-pink-900 font-bold text-[11px] select-none" title="iOS Mode: Direct Copy Enabled">
                                <i class="fab fa-apple text-stone-700 text-sm"></i>
                                <span class="hidden xs:inline text-[10px] text-stone-600">iOS</span>
                            </div>
                            `
                            }
                            
                            <div class="w-px h-5 bg-pink-100 mx-0.5 hidden sm:block"></div>

                            <button data-action="logout" class="p-1.5 sm:p-2 text-stone-400 hover:text-rose-500 hover:bg-rose-50 rounded-xl transition-colors flex items-center justify-center shrink-0 w-8 h-8 sm:w-9 sm:h-9" title="Sign Out">
                                <i class="fas fa-power-off text-xs sm:text-sm"></i>
                            </button>
                        </div>
                    </nav>

                    <!-- Main Content Area -->
                    <main class="flex-1 min-h-0 flex flex-col relative bg-white w-full z-40 overflow-hidden">
                        <div class="absolute inset-0 bg-pink-50/30 opacity-50 pointer-events-none z-0"></div>
                        <div id="main-view-container" class="w-full flex-1 min-h-0 flex flex-col relative z-10 overflow-hidden">
                            ${renderActiveView()}
                        </div>
                    </main>

                    <!-- Bottom Configurable Navigation -->
                    <nav class="bg-white border-t border-pink-100 flex justify-around items-stretch h-[calc(60px+env(safe-area-inset-bottom))] sm:h-[calc(70px+env(safe-area-inset-bottom))] pb-safe shrink-0 shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-30 w-full relative">
                        ${renderBottomNav()}
                    </nav>

                    <!-- Modal Root -->
                    <div id="modal-container">
                        ${renderModal()}
                        ${renderUserActivityModal()}
                        ${renderConfirmDialogModal()}
                        ${renderSqlModal()}
                    </div>
                </div>
            `;
      }

      // Initialize application
      async function initApp() {
        try {
          const safeFetch = (p) =>
            p
              .then((r) => r || { data: null, error: null })
              .catch((err) => ({ data: null, error: err }));

          const [
            linksRes,
            usersRes,
            historyRes,
            browsersRes,
            attrsRes,
            pinnedRes,
          ] = await Promise.all([
            safeFetch(supabaseClient.from("links").select("*")),
            safeFetch(supabaseClient.from("users").select("*")),
            safeFetch(
              supabaseClient
                .from("history")
                .select("*")
                .order("timestamp", { ascending: false }),
            ),
            safeFetch(supabaseClient.from("browsers").select("*")),
            safeFetch(supabaseClient.from("attributes").select("*")),
            safeFetch(supabaseClient.from("user_pinned_links").select("*")),
          ]);

          const links = linksRes?.data;
          const users = usersRes?.data;
          const history = historyRes?.data;
          const browsers = browsersRes?.data;
          const attrs = attrsRes?.data;
          const pinned = pinnedRes?.data;

          // Note table availability in Supabase
          state.usersSupabaseAvailable = !usersRes?.error;
          state.browsersSupabaseAvailable = !browsersRes?.error;

          if (attrs) {
            const mappedAttrs = {
              device: [],
              country: [],
              software: [],
              update: [],
            };
            attrs.forEach((a) => {
              if (mappedAttrs[a.type]) mappedAttrs[a.type].push(a.value);
            });
            state.attributes = mappedAttrs;
          }

          if (links) {
            state.links = links.map((l) => ({
              id: l.id,
              title: l.title,
              url: l.url,
              device: l.device,
              country: l.country,
              software: l.software,
              update: l.update_attr,
              usageCount: l.usage_count,
              isPinned: l.is_pinned,
              createdAt: l.created_at,
            }));
          }

          if (users) {
            const mappedUsers = users.map((u) => {
              const uPins = pinned
                ? pinned
                    .filter((p) => p.user_key === u.key)
                    .map((p) => p.link_id)
                : [];
              return {
                key: u.key,
                name: u.name,
                isUsed: u.is_used,
                isBanned: u.is_banned,
                createdAt: u.created_at,
                pinned: uPins,
                usage: {},
              };
            });
            const userMap = new Map();
            getLocalUsers().forEach((u) => userMap.set(u.key, u));
            mappedUsers.forEach((u) => userMap.set(u.key, u));
            state.users = Array.from(userMap.values());
            saveLocalUsers(state.users);
          } else {
            state.users = getLocalUsers();
          }

          // Aggregate usage from history
          if (history && state.users.length > 0) {
            history.forEach((h) => {
              const u = state.users.find((u) => u.key === h.user_key);
              if (u) {
                if (!u.usage) u.usage = {};
                u.usage[h.link_id] = (u.usage[h.link_id] || 0) + 1;
              }
            });
          }

          if (browsers) {
            const remoteBrowsers = browsers.map((b) => ({
              id: b.id,
              name: b.name,
              iconType: b.icon_type || "fas",
              iconClass: b.icon_class || "fa-globe",
              package: b.package,
            }));
            const browserMap = new Map();
            DEFAULT_BROWSERS.forEach((b) => browserMap.set(b.id, b));
            getLocalCustomBrowsers().forEach((b) => browserMap.set(b.id, b));
            remoteBrowsers.forEach((b) => browserMap.set(b.id, b));
            state.browsers = Array.from(browserMap.values());
            saveLocalCustomBrowsers(state.browsers);
          } else {
            state.browsers = [
              ...DEFAULT_BROWSERS,
              ...getLocalCustomBrowsers(),
            ];
          }

          if (history) {
            const now = Date.now();
            const TWENTY_FOUR_HOURS = 24 * 60 * 60 * 1000;

            const validHistory = [];
            history.forEach((h) => {
              const hTime = new Date(h.timestamp).getTime();
              if (now - hTime > TWENTY_FOUR_HOURS) {
                supabaseClient.from("history").delete().eq("id", h.id).then();
              } else {
                validHistory.push(h);
              }
            });

            state.history = validHistory.map((h) => ({
              id: h.id,
              userKey: h.user_key,
              linkId: h.link_id,
              title: h.title,
              url: h.url,
              timestamp: h.timestamp,
            }));
          }
        } catch (err) {
          console.warn("Notice loading data from Supabase:", err);
        } finally {
          state.isLoading = false;
          render();
        }
      }

      initApp();
      try {
        supabaseClient
          .channel("public-changes")
          .on("postgres_changes", { event: "*", schema: "public" }, () => {
            initApp();
          })
          .subscribe();
      } catch (e) {
        console.warn("Realtime channel notice:", e);
      }
    </script>
  </body>
</html>
